<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#3a6ea5" />
    <meta name="robots" content="noindex" />
    <title>Page not found · Hélder Gonçalves</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem('theme');
          if (t === 'light' || t === 'dark') {
            document.documentElement.setAttribute('data-theme', t);
          }
        } catch (e) {}
      })();
    </script>
    <style>
      /*
        This page is served verbatim by GitHub Pages and cannot @use the SASS
        tokens, so the palette is mirrored by hand from src/styles/_variables.scss.
        Keep the two in step — the values below are $canvas / $ink-900 / $ink-500 /
        $blue-600 on light, and the dark theme's bg / $ink-300 / $blue-400.

        --on-accent is the label colour for anything sitting *on* --accent. It is
        not always white: on dark, white over $blue-400 is only 2.65:1, which is
        why the main stylesheet splits --pill-text out per theme.
      */
      :root {
        --bg: #f7f9fc;
        --fg: #1c2330;
        --muted: #54627a;
        --accent: #3a6ea5;
        --on-accent: #ffffff;
      }
      :root[data-theme='dark'] {
        --bg: #0e131c;
        --fg: #e8edf7;
        --muted: #8e98ab;
        --accent: #6fa3da;
        --on-accent: #1c2330;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']) {
          --bg: #0e131c;
          --fg: #e8edf7;
          --muted: #8e98ab;
          --accent: #6fa3da;
          --on-accent: #1c2330;
        }
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
      }
      body {
        background: var(--bg);
        color: var(--fg);
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu,
          Cantarell, sans-serif;
        display: grid;
        place-items: center;
        padding: 2rem;
        line-height: 1.5;
      }
      main {
        max-width: 32rem;
        text-align: center;
      }
      .code {
        font-size: clamp(3.5rem, 12vw, 6rem);
        font-weight: 700;
        letter-spacing: -0.02em;
        color: var(--accent);
        margin: 0 0 0.5rem;
        line-height: 1;
      }
      h1 {
        font-size: clamp(1.25rem, 3.5vw, 1.75rem);
        margin: 0 0 0.75rem;
        font-weight: 600;
      }
      p {
        color: var(--muted);
        margin: 0 0 1.75rem;
      }
      a.home {
        display: inline-block;
        padding: 0.6rem 1.25rem;
        border-radius: 999px;
        background: var(--accent);
        color: var(--on-accent);
        text-decoration: none;
        font-weight: 500;
        transition: transform 120ms ease, opacity 120ms ease;
      }
      a.home:hover,
      a.home:focus-visible {
        transform: translateY(-1px);
        opacity: 0.92;
      }
      a.home:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 3px;
      }
      @media (prefers-reduced-motion: reduce) {
        a.home {
          transition: none;
        }
        a.home:hover,
        a.home:focus-visible {
          transform: none;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <p class="code" aria-hidden="true">404</p>
      <h1>Page not found</h1>
      <p>The link you followed doesn't exist on this site — it may have moved or never existed.</p>
      <a class="home" href="/">Back to the homepage</a>
    </main>
  </body>
</html>
