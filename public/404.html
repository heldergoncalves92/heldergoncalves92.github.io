<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#3a6ea5" />
    <meta name="robots" content="noindex" />
    <title>Page not found · Hélder Gonçalves</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      :root {
        --bg: #ffffff;
        --fg: #1a2742;
        --muted: #5a6783;
        --accent: #3a6ea5;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0e1320;
          --fg: #e8edf7;
          --muted: #9aa6c0;
          --accent: #6fa3da;
        }
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
      }
      body {
        background: var(--bg);
        color: var(--fg);
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu,
          Cantarell, sans-serif;
        display: grid;
        place-items: center;
        padding: 2rem;
        line-height: 1.5;
      }
      main {
        max-width: 32rem;
        text-align: center;
      }
      .code {
        font-size: clamp(3.5rem, 12vw, 6rem);
        font-weight: 700;
        letter-spacing: -0.02em;
        color: var(--accent);
        margin: 0 0 0.5rem;
        line-height: 1;
      }
      h1 {
        font-size: clamp(1.25rem, 3.5vw, 1.75rem);
        margin: 0 0 0.75rem;
        font-weight: 600;
      }
      p {
        color: var(--muted);
        margin: 0 0 1.75rem;
      }
      a.home {
        display: inline-block;
        padding: 0.6rem 1.25rem;
        border-radius: 999px;
        background: var(--accent);
        color: #fff;
        text-decoration: none;
        font-weight: 500;
        transition: transform 120ms ease, opacity 120ms ease;
      }
      a.home:hover,
      a.home:focus-visible {
        transform: translateY(-1px);
        opacity: 0.92;
      }
      a.home:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="code" aria-hidden="true">404</p>
      <h1>Page not found</h1>
      <p>The link you followed doesn't exist on this site — it may have moved or never existed.</p>
      <a class="home" href="/">Back to the homepage</a>
    </main>
  </body>
</html>
